{% extends 'header.html' %}
{% load static %}
{% block content %}
<!DOCTYPE html>
<html lang="en">

<body>

    <!-- Single Page Header start -->
    <div class="container-fluid page-header py-5">
        <h1 class="text-center text-white display-6">Forgot Password</h1>
        <ol class="breadcrumb justify-content-center mb-0">
            <li class="breadcrumb-item"><a href="/">Home</a></li>
            <li class="breadcrumb-item active text-white">Forgot Password</li>
        </ol>
    </div>
    <!-- Single Page Header End -->


    <!-- Choice Start -->
    <div class="container-fluid contact py-5">
        <div class="container py-5">
            <div class="p-5 bg-light rounded">
                <div class="row g-4">
                    <div class="col-lg-12 text-center">
                        <p class="mb-4">Choose how you want to receive the OTP to reset your password:</p>
                        <a href="{% url 'forgot_password_mobile' %}" class="btn btn-primary me-3">Via Mobile Number</a>
                        <a href="{% url 'forgot_password_email' %}" class="btn btn-secondary">Via Email</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <!-- Choice End -->


</body>

</html>
{% endblock %}
