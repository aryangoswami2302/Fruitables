{% extends 'header.html' %}
{% load static %}
{% block content %}
<!DOCTYPE html>
<html lang="en">


<body>

    <!-- Single Page Header start -->
    <div class="container-fluid page-header py-5">
        <h1 class="text-center text-white display-6">Profile</h1>
        <ol class="breadcrumb justify-content-center mb-0">
            <li class="breadcrumb-item"><a href="/">Home</a></li>
            <li class="breadcrumb-item active text-white">Profile</li>
        </ol>
    </div>
    <!-- Single Page Header End -->


    <!-- Contact Start -->
    <div class="container-fluid contact py-5">
        <div class="container py-5">
            <div class="p-5 bg-light rounded">
                <div class="row g-4">
                    <div class="col-lg-12">
                        <form action="{% url 'profile' %}" method="post" class="" enctype="multipart/form-data">
                            {% csrf_token %}
                            <input type="text" class="w-100 form-control border-0 py-3 mb-4"
                                value="{{user.fname}}" name="fname">
                            <input type="text" class="w-100 form-control border-0 py-3 mb-4"
                                value="{{user.lname}}" name="lname">
                            <input type="text" class="w-100 form-control border-0 py-3 mb-4"
                                value="{{user.mobile}}" name="mobile">
                             <input type="email" class="w-100 form-control border-0 py-3 mb-4"
                                value="{{user.email}}" name="email" readonly>
                            <textarea class="w-100 form-control border-0 mb-4" rows="5" cols="10"
                                placeholder="Your Address" name="address">{{user.address}}</textarea>
                            <img src="{{user.profile_picture.url}}" style="width: 100px; height: 100px; border-radius: 50%;">
                            <input type="file" class="w-100 form-control border-0 py-3 mb-4" name="profile_picture">
                            <button class="w-100 btn form-control border-secondary py-3 bg-white text-primary "
                                type="submit">Update Profile</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <!-- Contact End -->


</body>

</html>
{% endblock %}
