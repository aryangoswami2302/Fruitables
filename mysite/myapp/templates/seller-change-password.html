{% extends 'seller-header.html' %}
{% load static %}
{% block content %}
<!DOCTYPE html>
<html lang="en">


<body>

    <!-- Single Page Header start -->
    <div class="container-fluid page-header py-5">
        <h1 class="text-center text-white display-6">Change Password</h1>
        <ol class="breadcrumb justify-content-center mb-0">
            <li class="breadcrumb-item"><a href="/">Home</a></li>
            <li class="breadcrumb-item active text-white">Change Password</li>
        </ol>
    </div>
    <!-- Single Page Header End -->


    <!-- Contact Start -->
    <div class="container-fluid contact py-5">
        <div class="container py-5">
            <div class="p-5 bg-light rounded">
                <div class="row g-4">
                    <div class="col-lg-12">
                        <form action="{% url 'change-password' %}" method="post">
                            {% csrf_token %}
                            <input type="password" class="w-100 form-control border-0 py-3 mb-4"
                                placeholder="Your Old Password" name="password">
                            <input type="password" class="w-100 form-control border-0 py-3 mb-4"
                                placeholder="Your New Password" name="new_password">
                            <input type="password" class="w-100 form-control border-0 py-3 mb-4"
                                placeholder="Your Confirm New  Password" name="CNew_password">
                            <button class="w-100 btn form-control border-secondary py-3 bg-white text-primary "
                                type="submit">Change Password</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <!-- Contact End -->


</body>

</html>
{% endblock %}
