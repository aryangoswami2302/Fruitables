{% extends 'header.html' %}
{% load static %}
{% block content %}
<!DOCTYPE html>
<html lang="en">


<body>

    <!-- Single Page Header start -->
    <div class="container-fluid page-header py-5">
        <h1 class="text-center text-white display-6">Signup</h1>
        <ol class="breadcrumb justify-content-center mb-0">
            <li class="breadcrumb-item"><a href="/">Home</a></li>
            <li class="breadcrumb-item active text-white">Signup</li>
        </ol>
    </div>
    <!-- Single Page Header End -->


    <!-- SignUp Start -->
    <div class="container-fluid contact py-5">
        <div class="container py-5">
            <div class="p-5 bg-light rounded">
                <div class="row g-4">
                    <div class="col-lg-12">
                        <form action="{% url 'signup' %}" method="post" class="" enctype="multipart/form-data">
                            {% csrf_token %}
                            <select name="usertype" class="w-100 form-control border-0 py-3 mb-4">
                                <option>----Select User Type----</option>
                                <option value="buyer">Buyer</option>
                                <option value="seller">Seller</option>
                            </select>
                            <input type="text" class="w-100 form-control border-0 py-3 mb-4"
                                placeholder="Your First Name" name="fname">
                            <input type="text" class="w-100 form-control border-0 py-3 mb-4"
                                placeholder="Your Last Name" name="lname">
                            <input type="text" class="w-100 form-control border-0 py-3 mb-4"
                                placeholder="Your Mobile Number" name="mobile">
                            <input type="password" class="w-100 form-control border-0 py-3 mb-4"
                                placeholder="Your Password" name="password">
                            <input type="password" class="w-100 form-control border-0 py-3 mb-4"
                                placeholder="Confirm Your Password" name="cpassword">
                            <input type="file" class="w-100 form-control border-0 py-3 mb-4" name="profile_picture">
                            <input type="email" class="w-100 form-control border-0 py-3 mb-4"
                                placeholder="Your Email Address" name="email">
                            <textarea class="w-100 form-control border-0 mb-4" rows="5" cols="10"
                                placeholder="Your Address" name="address"></textarea>
                            <button class="w-100 btn form-control border-secondary py-3 bg-white text-primary "
                                type="submit">Signup</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <!-- SignUp End -->

</body>

</html>
{% endblock %}
